<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, WenQuanYi Zen Hei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1280" height="940" fill="#ffffff"/>
  <text x="640" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">sales-analysis-demo 架构示意图（nanobot 二次开发案例）</text>

  <!-- ============ 区块 A：文件布局 ============ -->
  <text x="40" y="82" font-size="15" font-weight="bold" fill="#0f172a">① 文件布局：examples 目录是「总览地图」，三个文件以软链接指向真身</text>

  <rect x="40" y="96" width="400" height="160" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="118" font-size="13" font-weight="bold" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">examples/sales-analysis-demo/</text>
  <text x="56" y="142" font-size="11.5" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">README.md          物理 · 文档地图</text>
  <text x="56" y="160" font-size="11.5" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">demo_e2e.py        物理 · 端到端演示</text>
  <text x="56" y="178" font-size="11.5" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">demo_shop.db       物理 · 订单库(28KB)</text>
  <text x="56" y="196" font-size="11.5" font-weight="bold" fill="#b45309" font-family="ui-monospace, Menlo, Consolas, monospace">database.py        软链接 ──→</text>
  <text x="56" y="214" font-size="11.5" font-weight="bold" fill="#b45309" font-family="ui-monospace, Menlo, Consolas, monospace">SKILL.md           软链接 ──→</text>
  <text x="56" y="232" font-size="11.5" font-weight="bold" fill="#b45309" font-family="ui-monospace, Menlo, Consolas, monospace">test_database.py   软链接 ──→</text>

  <line x1="440" y1="196" x2="686" y2="123" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <line x1="440" y1="214" x2="686" y2="179" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <line x1="440" y1="232" x2="686" y2="235" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="545" y="212" font-size="10.5" fill="#94a3b8">软链接</text>

  <rect x="690" y="100" width="550" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="706" y="118" font-size="12" font-weight="bold" fill="#1d4ed8" font-family="ui-monospace, Menlo, Consolas, monospace">nanobot/agent/tools/database.py</text>
  <text x="706" y="136" font-size="10.5" fill="#475569">真身 Tool · ToolLoader 用 pkgutil 扫描目录自动发现，零手动注册</text>

  <rect x="690" y="156" width="550" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="706" y="174" font-size="12" font-weight="bold" fill="#c2410c" font-family="ui-monospace, Menlo, Consolas, monospace">nanobot/skills/sales-analysis/SKILL.md</text>
  <text x="706" y="192" font-size="10.5" fill="#475569">真身 Skill · SkillsLoader 扫描发现，frontmatter 含 always: true</text>

  <rect x="690" y="212" width="550" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="706" y="230" font-size="12" font-weight="bold" fill="#15803d" font-family="ui-monospace, Menlo, Consolas, monospace">tests/agent/tools/test_database.py</text>
  <text x="706" y="248" font-size="10.5" fill="#475569">真身测试 · 测试目录须镜像包结构，共 13 个用例</text>

  <!-- ============ 区块 B：运行时链路 ============ -->
  <text x="40" y="296" font-size="15" font-weight="bold" fill="#0f172a">② 运行时链路：一次「城市消费」问答 —— Tool 是手，Skill 是脑</text>

  <rect x="40" y="330" width="160" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="120" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#075985">用户提问</text>
  <text x="120" y="372" text-anchor="middle" font-size="10.5" fill="#0c4a6e">"哪个城市的已付款</text>
  <text x="120" y="386" text-anchor="middle" font-size="10.5" fill="#0c4a6e">消费金额最高？"</text>
  <line x1="200" y1="362" x2="238" y2="362" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="244" y="316" width="596" height="316" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="262" y="338" font-size="13" font-weight="bold" fill="#0369a1">nanobot agent 循环</text>

  <rect x="262" y="348" width="560" height="58" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="278" y="370" font-size="11.5" font-weight="bold" fill="#9a3412">Skill（脑）· SKILL.md 摘要注入 system prompt（always: true）</text>
  <text x="278" y="392" font-size="11.5" fill="#7c2d12">表结构 · 指标口径：销售额只统计 completed · 3 个 SQL 模板</text>
  <line x1="542" y1="406" x2="542" y2="420" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="262" y="424" width="560" height="56" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="278" y="446" font-size="11.5" font-weight="bold" fill="#0369a1">模型生成工具调用 query_database(sql=…)</text>
  <text x="278" y="466" font-size="10.5" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace">SELECT c.city, SUM(i.quantity*i.unit_price) … WHERE o.status='completed'</text>
  <line x1="542" y1="480" x2="542" y2="494" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="552" y="492" font-size="10.5" fill="#475569">ToolRegistry 按名称精确匹配后执行</text>

  <rect x="262" y="498" width="560" height="50" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="278" y="518" font-size="11.5" font-weight="bold" fill="#0369a1">工具返回 JSON（ToolResult）</text>
  <text x="278" y="538" font-size="10.5" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace">{"columns":["city","orders","revenue"], "rows":[["深圳",25,79828.36],…]}</text>
  <line x1="542" y1="548" x2="542" y2="562" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="262" y="566" width="560" height="52" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="278" y="586" font-size="11.5" font-weight="bold" fill="#065f46">最终回答（数字必须引用查询结果，不得凭空估算）</text>
  <text x="278" y="606" font-size="11.5" fill="#047857">已付款消费最高：深圳 · 25 笔订单 · ¥79,828.36</text>

  <line x1="840" y1="460" x2="886" y2="460" stroke="#334155" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="863" y="450" text-anchor="middle" font-size="10.5" fill="#334155">调用</text>

  <rect x="886" y="316" width="206" height="316" rx="10" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="989" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Tool「手」DatabaseTool</text>
  <rect x="900" y="350" width="178" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="989" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">① SELECT / WITH 白名单</text>
  <text x="989" y="390" text-anchor="middle" font-size="10" fill="#7f1d1d">拒绝时附 schema 查询提示</text>
  <rect x="900" y="410" width="178" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="989" y="431" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">② 多语句拒绝</text>
  <text x="989" y="450" text-anchor="middle" font-size="10" fill="#7f1d1d">语句中含 ";" 即拒</text>
  <rect x="900" y="470" width="178" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="989" y="491" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">③ SQLite mode=ro 只读</text>
  <text x="989" y="510" text-anchor="middle" font-size="10" fill="#7f1d1d">文件级兜底，写操作必败</text>
  <rect x="900" y="530" width="178" height="52" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="989" y="551" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">④ 资源限额</text>
  <text x="989" y="570" text-anchor="middle" font-size="10" fill="#7f1d1d">VM 步数预算 + 行数截断</text>
  <text x="989" y="606" text-anchor="middle" font-size="10" fill="#64748b">asyncio.to_thread 执行，不阻塞事件循环</text>

  <line x1="1092" y1="424" x2="1126" y2="406" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="1102" y="404" font-size="10" fill="#dc2626">SQL</text>
  <line x1="1126" y1="418" x2="1092" y2="436" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="1096" y="448" font-size="10" fill="#7c3aed">JSON</text>

  <ellipse cx="1196" cy="364" rx="62" ry="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="1134" y="364" width="124" height="84" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="1134" y="364" width="124" height="84" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <ellipse cx="1196" cy="448" rx="62" ry="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1196" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">demo_shop.db</text>
  <text x="1196" y="421" text-anchor="middle" font-size="10" fill="#6d28d9">orders 142 · items 347</text>
  <text x="1196" y="435" text-anchor="middle" font-size="10" fill="#6d28d9">customers 60 · products 10</text>

  <!-- ============ 区块 C：验证分层与启用方式 ============ -->
  <text x="40" y="672" font-size="15" font-weight="bold" fill="#0f172a">③ 验证分层：不确定性逐层收窄</text>

  <rect x="40" y="688" width="340" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="58" y="712" font-size="12.5" font-weight="bold" fill="#065f46">验证① pytest · 13 个用例</text>
  <text x="58" y="731" font-size="10.5" fill="#047857">白名单 / 只读 / 截断 / 工具与配置发现</text>
  <text x="58" y="748" font-size="10.5" fill="#047857">无需 LLM · 秒级反馈</text>
  <line x1="380" y1="731" x2="404" y2="731" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="410" y="688" width="340" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="428" y="712" font-size="12.5" font-weight="bold" fill="#065f46">验证② demo_e2e.py 端到端</text>
  <text x="428" y="731" font-size="10.5" fill="#047857">ToolLoader → Registry → 真实执行 → SkillsLoader</text>
  <text x="428" y="748" font-size="10.5" fill="#047857">脚本扮演模型调用 · 无需 LLM key</text>
  <line x1="750" y1="731" x2="774" y2="731" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="780" y="688" width="460" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="798" y="712" font-size="12.5" font-weight="bold" fill="#065f46">验证③ nanobot agent 实跑</text>
  <text x="798" y="731" font-size="10.5" fill="#047857">真实 LLM 决策 + skill 注入 · uv run nanobot agent -m "…"</text>
  <text x="798" y="748" font-size="10.5" fill="#047857">依赖模型能力（小模型可能输出格式退化）</text>

  <rect x="40" y="806" width="580" height="100" rx="8" fill="#0f172a"/>
  <text x="58" y="832" font-size="12" font-weight="bold" fill="#7dd3fc" font-family="ui-monospace, Menlo, Consolas, monospace">~/.nanobot/config.json（用户启用方式）</text>
  <text x="58" y="856" font-size="11" fill="#e2e8f0" font-family="ui-monospace, Menlo, Consolas, monospace">{ "tools": { "database": { "enabled": true,</text>
  <text x="58" y="876" font-size="11" fill="#e2e8f0" font-family="ui-monospace, Menlo, Consolas, monospace">    "databasePath": "examples/sales-analysis-demo/demo_shop.db" } } }</text>

  <rect x="660" y="806" width="580" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="678" y="832" font-size="12" font-weight="bold" fill="#0f172a">已验证结果（2026-09-16）</text>
  <text x="678" y="856" font-size="11" fill="#334155">13/13 测试通过 · 回归 275 全过 · ruff 无告警</text>
  <text x="678" y="876" font-size="11" fill="#334155">深圳 TOP1 ¥79,828.36 · 退款率 14.1% · DELETE 被正确拒绝</text>
</svg>
